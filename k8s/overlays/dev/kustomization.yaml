apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dev
resources:
  - ../../base
labels:
  - pairs:
      env: dev
    includeSelectors: false
    includeTemplates: true
replicas:
  - name: myapp
    count: 1
patches:
  - path: deployment-patch.yaml
images:
  - name: acrmkatf28060.azurecr.io/myapp
    newTag: v2
