# Argo CD Application for the weekday app in namespace dev.
# Applied by Terraform after Argo CD is up, or:
#   kubectl apply -f gitops/
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: weekday-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/mka-main/azure-kuber-test.git
    targetRevision: main
    path: k8s/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
