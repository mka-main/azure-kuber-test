# Argo CD Application for the weekday app in namespace stage.
# No automated sync: promote by pushing an overlay change, then Sync in the UI.
# Applied by Terraform after Argo CD is up, or:
#   kubectl apply -f gitops/
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: weekday-stage
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/mka-main/azure-kuber-test.git
    targetRevision: main
    path: k8s/overlays/stage
  destination:
    server: https://kubernetes.default.svc
    namespace: stage
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
