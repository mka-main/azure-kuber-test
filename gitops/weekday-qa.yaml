# Argo CD Application for the weekday app in namespace qa.
# Applied by Terraform after Argo CD is up, or:
#   kubectl apply -f gitops/
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: weekday-qa
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/mka-main/azure-kuber-test.git
    targetRevision: main
    path: k8s/overlays/qa
  destination:
    server: https://kubernetes.default.svc
    namespace: qa
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
