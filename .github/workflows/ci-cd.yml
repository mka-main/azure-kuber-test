name: ci-cd

on:
  push:
    branches: [main]
  workflow_dispatch:

# Put a service principal JSON in GitHub secret AZURE_CREDENTIALS.
# Also set ACR_NAME, RG_NAME, AKS_NAME (from terraform output after apply).

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Build and push image to ACR
        run: |
          az acr build \
            --registry "${{ secrets.ACR_NAME }}" \
            --image "myapp:${{ github.sha }}" \
            --image "myapp:v1" \
            ./app

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - uses: azure/use-kubelogin@v1
        with:
          kubelogin-version: v0.1.4
      - uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ secrets.RG_NAME }}
          cluster-name: ${{ secrets.AKS_NAME }}
      - name: Apply manifests
        run: |
          login="$(az acr show -n "${{ secrets.ACR_NAME }}" --query loginServer -o tsv)"
          image="${login}/myapp:${{ github.sha }}"
          tmp="$(mktemp -d)"
          for f in aks/manifests/*.yaml; do
            sed "s|__IMAGE__|${image}|g" "$f" > "${tmp}/$(basename "$f")"
          done
          kubectl apply -f "${tmp}"
          kubectl -n learn rollout status deployment/myapp --timeout=180s
