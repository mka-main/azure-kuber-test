<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>This week</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700;800&family=Figtree:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app">
      <p class="range" id="range"></p>

      <section class="stage">
        <button class="arrow" type="button" id="prev" aria-label="Previous day">←</button>

        <div class="focus" aria-live="polite">
          <p class="status" id="status"></p>
          <p class="number" id="number"></p>
          <h1 class="weekday" id="weekday"></h1>
        </div>

        <button class="arrow" type="button" id="next" aria-label="Next day">→</button>
      </section>

      <nav class="week" id="week" aria-label="Current week"></nav>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
